<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../styles.css" />
    <title>BMI CALCULATOR</title>
</head>
<body style="background-color: rgb(85, 76, 76);color:aliceblue">

    <nav>
        <a href="https://myresumesubhajit.netlify.app/">ABOUT OWNER</a>

    </nav>
    <div class="container">
        <h1>BMI Calculator for user</h1>

        <form>
            <p><label>Height in CM:</label><input type="number" id="height"></p>
            <p><label>Weight in KG:</label><input type="number" id="weight"></p>

            <button>CALCULATE</button>

            <div id="results"></div>

            <div id="weight-guide">
          <h3>BMI Weight Guide</h3>
          <p>Very severely underweight = Less than 15</p>
          <p>severely underweight = Between 15 and 16</p>
          <p>Under Weight = Less than 18.6</p>
          <p>Normal Range = Between 18.6 and 24.9</p>
          <p>Overweight = Between 25 and 30</p>
          <p>Severely obese = Over 30</p>
        </div>

        </form>

    </div>
    
</body>
<script src="bmical.js"></script>
</html>
